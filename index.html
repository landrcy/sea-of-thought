<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sea of Thought</title>
<meta name="description" content="Sea of Thought — a pixel ocean of messages in bottles. Drop one in, or dive down and read the ones others left behind.">
<meta name="theme-color" content="#0096C7">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Sea of Thought">
<meta property="og:title" content="Sea of Thought">
<meta property="og:description" content="A pixel ocean of messages in bottles. Drop one in, or dive down and read the ones others left behind.">
<meta property="og:image" content="https://landrcy.github.io/sea-of-thought/assets/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Sea of Thought">
<meta name="twitter:description" content="A pixel ocean of messages in bottles. Drop one in, or dive down and read the ones others left behind.">
<meta name="twitter:image" content="https://landrcy.github.io/sea-of-thought/assets/og.png">
<meta name="music-credit" content="Music: Aquaria by cynicmusic (CC0 1.0) - https://opengameart.org/content/aquaria">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<canvas id="ocean" aria-hidden="true"></canvas>
<canvas id="sprites" aria-hidden="true"></canvas>
<canvas id="oceanfg" aria-hidden="true"></canvas>
<div id="spacer" aria-hidden="true"></div>

<h1 class="title">
  <picture><source media="(max-width:640px)" srcset="assets/title-m.png"><img id="title-img" src="assets/title.png" alt=""></picture>
  <span class="sr">Sea of Thought</span>
</h1>

<div id="overlay" role="group" aria-label="Bottles floating in the sea. Scroll down to dive deeper and find older bottles."></div>

<button class="ibtn tr" id="write-btn" type="button" aria-label="Write a bottle" data-tip="Write a bottle"><canvas aria-hidden="true"></canvas></button>
<button class="ibtn sm" id="food-btn" type="button" aria-label="Sprinkle fish food" data-tip="Feed the fish"><canvas aria-hidden="true"></canvas></button>
<button class="ibtn sm" id="music-btn" type="button" aria-pressed="true" aria-label="Mute music" data-tip="Music: Aquaria by cynicmusic (CC0)"><canvas aria-hidden="true"></canvas></button>
<button class="ibtn tl" id="del-btn" type="button" aria-pressed="false" aria-label="Delete a bottle: pick a bottle to send for review"><span id="del-label">delete a bottle</span></button>
<p class="toast" id="toast" role="status" aria-live="polite" hidden></p>
<p class="sr" id="live" role="status" aria-live="polite"></p>

<!-- write a bottle: a pixel parchment scroll -->
<div class="modal" id="wmodal" hidden>
  <div class="backdrop" data-close></div>
  <div class="dlg wdlg" id="wdlg" role="dialog" aria-modal="true" aria-label="Write a bottle">
    <button class="ibtn x" type="button" data-close aria-label="Close" data-tip="Close"><canvas aria-hidden="true"></canvas></button>
    <div class="pscroll" id="wscroll">
      <canvas class="roll top" aria-hidden="true"></canvas>
      <div class="sheetwrap"><form class="sheet" id="form" autocomplete="off"><div class="sheet-in">
        <label class="sr" for="name">Your name (optional)</label>
        <input id="name" class="ink name" maxlength="24" placeholder="signed, …" autocomplete="off">
        <label class="sr" for="msg">Your message</label>
        <textarea id="msg" class="ink" rows="6" maxlength="280" placeholder="Dear sea, …" aria-describedby="count"></textarea>
        <div class="tools">
          <canvas class="quillart" aria-hidden="true"></canvas>
          <span id="count" class="count" aria-live="off">0/280</span>
          <button type="button" class="ibtn paper" id="rocks" aria-label="Tie rocks to the bottle: 0" data-tip="Rocks: 0 · heavier sinks faster"><canvas aria-hidden="true"></canvas></button>
          <button type="submit" class="ibtn seal" id="send" aria-label="Seal the bottle and throw it into the sea" data-tip="Seal &amp; throw"><canvas aria-hidden="true"></canvas></button>
        </div>
        <p id="note" class="note" role="status"></p>
      </div></form></div>
      <canvas class="roll bottom" aria-hidden="true"></canvas>
    </div>
    <div class="workshop" id="workshop" aria-hidden="true"><canvas id="shop-cv" width="200" height="120"></canvas></div>
  </div>
</div>

<!-- read a bottle: an unrolled pixel scroll -->
<div class="modal" id="modal" hidden>
  <div class="backdrop" data-close></div>
  <div class="dlg rdlg" role="dialog" aria-modal="true" aria-labelledby="m-title">
    <button class="ibtn x" type="button" data-close aria-label="Close" data-tip="Close"><canvas aria-hidden="true"></canvas></button>
    <div class="pscroll" id="rscroll">
      <canvas class="roll top" aria-hidden="true"></canvas>
      <div class="sheetwrap"><div class="sheet"><div class="sheet-in">
        <h2 id="m-title" class="m-title">Bottle #1</h2>
        <p id="m-when" class="m-when"></p>
        <p id="m-body" class="m-body"></p>
        <p id="m-from" class="m-from"></p>
        <div id="m-rocks" class="m-rocks" hidden><span id="m-rocks-art"></span></div>
        <div class="nav">
          <button type="button" class="ibtn paper" id="m-prev" aria-label="Older bottle" data-tip="Older"><canvas aria-hidden="true"></canvas></button>
          <button type="button" class="ibtn paper" id="m-next" aria-label="Newer bottle" data-tip="Newer"><canvas aria-hidden="true"></canvas></button>
        </div>
      </div></div></div>
      <canvas class="roll bottom" aria-hidden="true"></canvas>
    </div>
  </div>
</div>

<!-- report a bottle: sent to a review queue, never deleted instantly -->
<div class="modal" id="rmodal" hidden>
  <div class="backdrop" data-close></div>
  <div class="dlg rpdlg" role="dialog" aria-modal="true" aria-labelledby="r-title">
    <button class="ibtn x" type="button" data-close aria-label="Close" data-tip="Close"><canvas aria-hidden="true"></canvas></button>
    <div class="pscroll" id="rpscroll">
      <canvas class="roll top" aria-hidden="true"></canvas>
      <div class="sheetwrap"><form class="sheet" id="rform" autocomplete="off"><div class="sheet-in">
        <h2 id="r-title" class="m-title">Send a bottle for review</h2>
        <p class="r-copy">This does <b>not</b> delete anything right away. Your note goes to a review queue and the bottle stays afloat until the keeper has looked at it.</p>
        <div class="r-row"><label for="r-num" class="r-lab">bottle #</label><input id="r-num" class="ink num" inputmode="numeric" maxlength="5" aria-describedby="r-peek" autocomplete="off"></div>
        <p id="r-peek" class="r-peek" aria-live="polite"></p>
        <label for="r-why" class="r-lab">why? <span class="r-opt">(optional)</span></label>
        <textarea id="r-why" class="ink" rows="3" maxlength="140" placeholder="tell the keeper what is wrong…"></textarea>
        <div class="tools">
          <span id="r-count" class="count">0/140</span>
          <button type="submit" class="ibtn paper txt" id="r-send" aria-label="Send for review"><canvas aria-hidden="true" class="flag"></canvas><span>send for review</span></button>
        </div>
        <p id="r-note" class="pnote" role="alert" hidden>Please keep it kind</p>
      </div></form></div>
      <canvas class="roll bottom" aria-hidden="true"></canvas>
    </div>
  </div>
</div>

<script src="assets/filter.js"></script>
<script src="assets/store.js"></script>
<script src="assets/scene.js"></script>
<script src="assets/bottles.js"></script>
<script src="assets/life.js"></script>
<script src="assets/seabed.js"></script>
<script src="assets/critters.js"></script>
<script src="assets/extras.js"></script>
<script src="assets/sprites.js"></script>
<script src="assets/ocean.js"></script>
<script src="assets/icons.js"></script>
<script src="assets/workshop.js"></script>
<script src="assets/music.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
